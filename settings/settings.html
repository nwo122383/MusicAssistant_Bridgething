<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Assistant Settings</title>
  </head>
  <body>
    <div id="root"><main id="settings-boot"><h1>Music Assistant</h1><p>Loading settings...</p></main></div>

      });
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
